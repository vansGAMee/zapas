name: Build applications
on: [workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: {name: Zapas-Android, path: android/app/build/outputs/apk/debug/*.apk}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r desktop/requirements.txt pyinstaller
      - run: choco install ffmpeg --yes --no-progress
      - run: pyinstaller --noconfirm --windowed --onedir --name Zapas --paths desktop --add-data 'desktop/web;web' --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all qrcode --hidden-import uvicorn.logging desktop/run.py
      - shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Recurse -Filter ffmpeg.exe | Sort-Object Length -Descending | Select-Object -First 1
          $ffprobe = Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Recurse -Filter ffprobe.exe | Sort-Object Length -Descending | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'FFmpeg binaries missing' }
          Copy-Item $ffmpeg.FullName dist/Zapas/ffmpeg.exe
          Copy-Item $ffprobe.FullName dist/Zapas/ffprobe.exe
          Copy-Item (Get-Command node.exe).Source dist/Zapas/node.exe
          Copy-Item THIRD_PARTY_NOTICES.md dist/Zapas/
          Copy-Item README.md dist/Zapas/
          Compress-Archive dist/Zapas dist/Zapas-Windows.zip
      - uses: actions/upload-artifact@v4
        with: {name: Zapas-Windows, path: dist/Zapas-Windows.zip}
