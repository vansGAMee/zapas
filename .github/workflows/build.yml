name: Build applications
on: [workflow_dispatch, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: {name: Zapas-Android, path: android/app/build/outputs/apk/debug/*.apk}
  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with:
          name: Zapas-Android
          path: android/app/build/outputs/apk/debug
      - run: python scripts/build_windows_portable.py
      - shell: pwsh
        run: |
          & 'dist/Запас-Windows/runtime/python.exe' scripts/verify_windows.py 'dist/Запас-Windows'
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime verification failed' }
          Compress-Archive -Path 'dist/Запас-Windows' -DestinationPath dist/Zapas-Windows.zip
      - uses: actions/upload-artifact@v4
        with: {name: Zapas-Windows, path: dist/Zapas-Windows.zip}
